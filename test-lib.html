<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Library Build</title>
    <link rel="stylesheet" href="./dist/lib-janelia/neuroglancer.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #neuroglancer-container {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="neuroglancer-container"></div>
    <script type="module">
      // Configure worker URLs before importing neuroglancer
      window.__NEUROGLANCER_CHUNK_WORKER_URL__ = "./dist/lib-janelia/chunk_worker.bundle.js";
      window.__NEUROGLANCER_ASYNC_COMPUTATION_WORKER_URL__ = "./dist/lib-janelia/async_computation.bundle.js";

      import { setupDefaultViewer } from "./dist/lib-janelia/main.js";

      const viewer = setupDefaultViewer({
        target: document.getElementById("neuroglancer-container"),
      });

      viewer.state.restoreState({
        layers: {
          image: {
            type: "image",
            source: "precomputed://gs://neuroglancer-public-data/flyem_fib-25/image",
          },
          segmentation: {
            type: "segmentation",
            source: "precomputed://gs://neuroglancer-public-data/flyem_fib-25/ground_truth",
          },
        },
        navigation: {
          zoomFactor: 8,
          pose: {
            position: {
              voxelSize: [8, 8, 8],
              voxelCoordinates: [2914, 3088, 4045],
            },
          },
        },
      });
    </script>
  </body>
</html>
